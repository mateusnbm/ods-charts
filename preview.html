<!doctype html>
<html lang="pt-BR">
<head>
	
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Preview - Indicador 1.1.1</title>
	
	<!-- Bootstrap's CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	
	<!-- Jquery -->
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<!-- Apache ECharts -->
	<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
	<!-- TopoJSON Client -->
	<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
	<!-- ODS Charts -->
	<script src="ods-charts.js"></script>
	
	<style>
		
		.regular-canvas {
			position: relative;
			width: 100%;
			height: 350px;
		}
		
		.spinner {
			position: absolute;
			top: 50%;
			left: 50%;
			width: 24px;
			height: 24px;
			margin-top: -12px;
			margin-left: -12px;
			border: 2px solid #e0e0e0;
			border-top-color: #0A58CA;
			border-radius: 50%;
			animation: spin 0.8s linear infinite;
			z-index: 10;
		}

		@keyframes spin {
			to { transform: rotate(360deg); }
		}
		
		
	</style>
	
</head>
<body>
	
	<div id="wrapper"></div>
	
	<script>
		
		function atualizarGraficos(graficos) {
			
			var html = "";
			
			graficos.forEach((params, index) => {
				
				html += `
					<div class="py-5 ${index % 2 == 0 ? "bg-white" : "bg-body-tertiary"}">
						<div class="container py-5">
							<div class="row" id="chart-row-${index}">
								<div class="col">
									<div class="regular-canvas" id="chart-${index}">
										<div class="spinner"></div>
									</div>
								</div>
							</div>
						</div>
					</div>
					`;
				
			});
			
			$("#wrapper").html(html);
			
			graficos.forEach((params, index) => {
				
				ODSCharts[params.tipo](`chart-${index}`, params).then((_) => { 
				
					$(`#chart-${index} .spinner`).remove(); 
					
				});
				
			});
			
		}
		
		function obterGraficos(indicador) {
			
			const url = `graficos/${indicador}.json`;
			
			$.ajax({
				url: url,
				method: 'GET',
				dataType: 'json',
				success: function (graficos) {
					
					atualizarGraficos(graficos);
					
				}
			});
			
		}
		
		$(document).ready(function () {
			
			const params = new URLSearchParams(window.location.search);
			const valor = params.get('indicador');
			const indicador = valor === null ? '1.1.1' : valor;
			
			obterGraficos(indicador);
			
			document.title = `Preview - Indicador ${indicador}`;
			
		});
		
	</script>
	
</body>
</html>
